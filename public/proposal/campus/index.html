<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0d1b2a"/><title>大溪國中校園導覽</title>  
  <link rel="stylesheet" crossorigin href="./assets/index-BXgbHzS7.css">
</head><body><div id="root"></div><script>(()=>{const aliases={
 'main-gate':'gate','student-center':'gym',admin:'academic',multifunction:'library',
 technology:'tech-building',art:'art-building',special:'new-grade7',basketball:'court-bb',
 parking:'bike-shed',breezeway:'breezeway',track:'track',
};
function explorerUrl(base,search){
 const input=new URLSearchParams(search),output=new URLSearchParams();
 const destination=input.get('to');
 if(destination)output.set('to',aliases[destination]??destination);
 if(input.get('view')==='plan')output.set('view','plan');
 if(input.get('profile')==='1')output.set('profile','1');
 const query=output.toString();
 return `${base}campus-explorer/index.html${query?'?'+query:''}`;
}

/* Shared by Vite development and the HTML-first production shell. */
function attachCampusLoading(frame, loading) {
 loading.innerHTML='<strong>大溪國中校園導覽</strong><span class="campus-loading-caption">正在整理校園地圖</span><span class="campus-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="campus-loading-note">請稍候，即將走進校園</span>';
 const note=loading.querySelector('.campus-loading-note'),caption=loading.querySelector('.campus-loading-caption');
 const actions=document.createElement('div');actions.className='campus-loading-actions';actions.hidden=true;
 const retry=document.createElement('button');retry.type='button';retry.textContent='重新載入';retry.onclick=()=>window.location.reload();
 const plan=document.createElement('a');plan.textContent='先看校園平面圖';plan.href=new URL('campus_plan_115.jpg',frame.src).href;
 actions.append(retry,plan);loading.append(actions);
 const slowTimer=window.setTimeout(()=>{note.textContent='載入時間較長，可以繼續等候，或先查看平面圖。';actions.hidden=false;},12000);
 function onMessage(event){
  if(event.source!==frame.contentWindow||event.origin!==new URL(frame.src).origin)return;
  if(event.data?.type==='campus-ready'){
   window.clearTimeout(slowTimer);loading.classList.add('is-ready');window.removeEventListener('message',onMessage);
  }else if(event.data?.type==='campus-startup-error'){
   window.clearTimeout(slowTimer);caption.textContent='暫時無法啟動立體場景';
   note.textContent='請重新載入，或先查看校園平面圖。';actions.hidden=false;loading.classList.add('has-error');
  }
 }
 window.addEventListener('message',onMessage);
 return ()=>{window.clearTimeout(slowTimer);window.removeEventListener('message',onMessage);};
}

if(new URLSearchParams(location.search).get('viewer')==='legacy'){const s=document.createElement('script');s.type='module';s.src="./assets/index-CmQJWDgY.js";document.head.append(s);return;}
const p=document.createElement('link');p.rel='preload';p.as='script';p.href='./campus-explorer/campus.10e14dd30e95.js';document.head.append(p);
const shell=document.createElement('main'),frame=document.createElement('iframe'),loading=document.createElement('div');
shell.className='campus-explorer-shell';frame.className='campus-explorer-frame';frame.title='大溪國中立體校園探索';frame.allow='fullscreen';frame.src=explorerUrl('./',location.search);
loading.className='campus-loading';loading.setAttribute('role','status');loading.setAttribute('aria-live','polite');
attachCampusLoading(frame,loading);shell.append(frame,loading);document.getElementById('root').replaceChildren(shell);})();</script></body></html>
