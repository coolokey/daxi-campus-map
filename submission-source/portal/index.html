    <section class="hero"><div class="hero-copy"><p class="eyebrow"><span class="status-dot"></span> 桃園市立大溪國中 · 創意教學提案</p><h1>每一次探索，<br>都是學習的開始。</h1><p class="hero-description">把熟悉的校園，變成充滿任務的學習世界。<br>學生在這裡闖關，來賓在這裡找到方向。</p><div class="hero-actions"><a class="button button-dark" href="#rpg">開始 RPG 探索 <span aria-hidden="true">↗</span></a><a class="button button-outline" href="#campus">進入校園導覽 <span aria-hidden="true">↗</span></a></div><p class="hero-footnote">雙介面可操作雛型 · 持續建置中</p></div><div class="hero-art"><img src="./assets/campus-map-960.webp" srcset="./assets/campus-map-480.webp 480w, ./assets/campus-map-960.webp 960w" sizes="(max-width: 700px) 90vw, 45vw" width="1525" height="1031" fetchpriority="high" decoding="async" alt="依大溪國中校園配置繪製的未來科技 RPG 校園地圖"><span class="map-label">一座校園，兩種探索方式</span><span class="map-stamp">CAMPUS<br>EXPLORER<br><b>01 / 02</b></span></div></section>
    <section class="experiences" aria-labelledby="experiences-title"><div class="section-intro"><p class="eyebrow">CHOOSE YOUR JOURNEY</p><h2 id="experiences-title">今天，想怎麼走進校園？</h2><p>選擇你的角色，從一段短短的探索開始。</p></div><div class="experience-grid"><article class="experience rpg-card"><div class="card-top"><span class="number">01</span><span class="tag">學生 · 教師</span></div><h3>在任務裡，找到答案。</h3><p>走進未來科技校園，和數字研究員交談。完成五個數學校準任務，一起修復校園能源核心。</p><ul><li>可走動校園與研究室</li><li>五題數學任務、錯題提示</li><li>過關徽章與匿名概念回饋</li></ul><a class="text-link" href="#rpg">體驗 RPG 學習任務 <span aria-hidden="true">→</span></a></article><article class="experience campus-card"><div class="card-top"><span class="number">02</span><span class="tag">來賓 · 新生 · 家長</span></div><h3>第一次來，也能有方向。</h3><p>從立體校園認識棟別與樓層，搜尋處室或教室，跟著示意路線探索目的地。</p><ul><li>立體鳥瞰與人物漫遊</li><li>場所搜尋、樓層與定位小地圖</li><li>目的地連結與示意帶路</li></ul><a class="text-link" href="#campus">體驗立體校園導覽 <span aria-hidden="true">→</span></a></article></div></section>
    <section class="visitor-strip"><div><p class="eyebrow">VISITOR SHORTCUT</p><h2>先找到目的地，再慢慢認識校園。</h2><p>先以既有場所示範。實際活動場地由承辦人確認後，再設定專屬導覽連結。</p></div><div class="destination-links"><a href="#campus?to=academic">前往教務處 <span>→</span></a><a href="#campus?to=library">探索圖書館 <span>→</span></a><a href="#campus?to=gate">從校門開始 <span>→</span></a></div></section>
    <section class="progress-section" id="progress"><div class="section-intro"><p class="eyebrow">A CAMPUS STILL GROWING</p><h2>從可體驗的現在，走向完整的學園。</h2><p>這是一份持續實作的提案。以下區分本次可體驗功能與後續目標。</p></div><div class="roadmap"><article><span class="phase current">本次可體驗</span><h3>雙介面探索雛型</h3><p>RPG 校園探索、五題數學任務與本機規則回饋；立體校園的場所搜尋與示意導覽。</p></article><article><span class="phase">下一階段</span><h3>AI 任務助教</h3><p>教師提供教材，AI 草擬任務與分層提示，經教師審核後使用。生成式 AI 尚未介接。</p></article><article><span class="phase">持續擴充</span><h3>各科教材與校園記憶</h3><p>逐科加入教材、打怪與獎勵機制，整理有來源的歷史照片與故事，建構懷舊探索。</p></article></div></section>
    <section class="demo-guide" id="demo-guide"><div><p class="eyebrow">THREE-MINUTE WALKTHROUGH</p><h2>三分鐘，看見提案的樣貌。</h2></div><ol><li><span>01</span><div><strong>探索與闖關</strong><p>進入 RPG，快速體驗任務，示範答錯提示與過關摘要。</p></div></li><li><span>02</span><div><strong>找場所與看路線</strong><p>進入校園導覽，搜尋教務處，查看樓層與示意路線。</p></div></li><li><span>03</span><div><strong>說明下一步</strong><p>回到首頁，介紹 AI 教材審核、跨科與校園記憶的建置方向。</p></div></li></ol></section>
